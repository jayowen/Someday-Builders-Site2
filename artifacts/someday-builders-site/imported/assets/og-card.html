<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Someday Builders og card (1200x630)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #F7F4ED;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(184, 154, 93, 0.55);
      pointer-events: none;
    }
    .lockup { text-align: center; }
    .mark {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 96px;
      color: #4F6A5B;
      line-height: 1.15;
    }
    .word-someday { font-style: italic; font-weight: 500; }
    .word-builders {
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.82em;
    }
    .tagline {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 34px;
      letter-spacing: 0.09em;
      color: #B9785C;
      margin-top: 22px;
    }
    .site {
      position: absolute;
      bottom: 52px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Source Sans 3", Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #50575E;
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="lockup">
    <img src="logo-wordmark.png" alt="Someday Builders" style="width: 820px; height: auto; display: block; margin: 0 auto;">
    <p class="tagline">Start building your Someday...</p>
  </div>
  <p class="site">somedaybuilders.com</p>
</body>
</html>
